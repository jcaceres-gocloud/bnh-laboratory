services:
  kafka:
    image: apache/kafka:4.3.0
    container_name: bnh-kafka
    hostname: kafka

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT

      KAFKA_LISTENERS: >
        CONTROLLER://:29093,
        INTERNAL://:19092,
        EXTERNAL://:9092

      KAFKA_ADVERTISED_LISTENERS: >
        INTERNAL://kafka:19092,
        EXTERNAL://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka:29093

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka_data:/var/lib/kafka/data

  producer:
    build:
      context: ./apps/producer
    container_name: bnh-producer

    depends_on:
      kafka:
        condition: service_healthy

    restart: "no"

  consumer:
    build:
      context: ./apps/consumer
    container_name: bnh-consumer

    depends_on:
      kafka:
        condition: service_healthy

    restart: "no"

  api:
    build:
      context: ./apps/api
    container_name: bnh-api

    depends_on:
      kafka:
        condition: service_healthy

    ports:
      - "8000:8000"

    restart: "no"

  nifi:
    image: apache/nifi:2.11.0
    container_name: bnh-nifi
    hostname: nifi

    depends_on:
      kafka:
        condition: service_healthy

    ports:
      - "8443:8443"

    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: BnhLaboratory1234
    
    volumes:
      - ./data/incoming:/data/incoming
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_state:/opt/nifi/nifi-current/state
      - nifi_database:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository

    restart: "no"

  grpc-server:
    build:
      context: ./apps/grpc
      dockerfile: server/Dockerfile
    container_name: bnh-grpc-server
    hostname: grpc-server

    depends_on:
      kafka:
        condition: service_healthy

    ports:
      - "50051:50051"
      - "8001:8001"

    restart: "no"

  grpc-client:
    build:
      context: ./apps/grpc
      dockerfile: client/Dockerfile
    container_name: bnh-grpc-client

    depends_on:
      - grpc-server

    environment:
      TOTAL_PERSONAS: ${TOTAL_PERSONAS:-10}
      GRPC_CASE: ${GRPC_CASE:-valid}
      LOTE_ID: ${LOTE_ID:-}

    restart: "no"

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: bnh-prometheus
    depends_on:
      grpc-server:
        condition: service_started
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: "no"

  grafana:
    image: grafana/grafana:13.2.0
    container_name: bnh-grafana
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: "no"

  flink-jobmanager:
    build:
      context: ./apps/flink
      dockerfile: Dockerfile
    image: bnh-flink:2.1.1
    container_name: bnh-flink-jobmanager
    hostname: flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    volumes:
      - ./apps/flink/jobs:/opt/flink/jobs:ro
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        s3.endpoint: http://minio:9000
        s3.access-key: bnhadmin
        s3.secret-key: BnhMinioLaboratory1234
        s3.path.style.access: true
    restart: "no"

  flink-taskmanager:
    build:
      context: ./apps/flink
      dockerfile: Dockerfile
    image: bnh-flink:2.1.1
    container_name: bnh-flink-taskmanager
    hostname: flink-taskmanager
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_started
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        s3.endpoint: http://minio:9000
        s3.access-key: bnhadmin
        s3.secret-key: BnhMinioLaboratory1234
        s3.path.style.access: true
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: bnh-minio
    hostname: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: bnhadmin
      MINIO_ROOT_PASSWORD: BnhMinioLaboratory1234
    volumes:
      - minio_data:/data
    restart: "no"

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: bnh-minio-init
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set bnh http://minio:9000 bnhadmin BnhMinioLaboratory1234; do
          sleep 1
        done
        mc mb --ignore-existing bnh/bnh-bronze
    restart: "no"

volumes:
  kafka_data:
  nifi_conf:
  nifi_state:
  nifi_database:
  nifi_flowfile:
  nifi_content:
  nifi_provenance:
  prometheus_data:
  grafana_data:
  minio_data:
