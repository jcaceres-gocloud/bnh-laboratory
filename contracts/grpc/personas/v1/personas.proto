syntax = "proto3";

package bnh.personas.v1;


message Metadata {
  string jurisdiccion = 1;
  string dominio = 2;
  string lote_id = 3;
}


// Transporte del registro. La validación de Persona la hace Flink.
// optional permite omitir campos; proto3 no puede representar ints/bools
// ni JSON null, a diferencia de REST/Kafka.
message Persona {
  optional string id_persona = 1;
  optional string fecha_nacimiento = 2;
  optional string cuit = 3;
  optional string c_documento = 4;
  optional string nro_documento = 5;
  optional string c_pais_nacimiento = 6;
  optional string c_provincia_nacimiento = 7;
  optional string c_departamento_nacimiento = 8;
  optional string c_localidad_nacimiento = 9;
  optional string c_municipio_nacimiento = 10;
  optional string lugar_nacimiento = 11;
  optional string c_fallecido = 12;
  optional string fecha_fallecido = 13;
  optional string c_es_indigena = 14;
}


message CargaPersonaRequest {
  Metadata metadata = 1;
  Persona registro = 2;
}


message ResultadoCarga {
  string lote_id = 1;
  int32 cantidad_recibida = 2;
  string estado = 3;
}


service PersonasService {
  rpc EnviarPersonas(stream CargaPersonaRequest) returns (ResultadoCarga);
}
